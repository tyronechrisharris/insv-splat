[project]
name = "insv-splat"
version = "0.3.0"
description = "Stitch-free Insta360 & Antigravity A1 (.insv) dual-fisheye video to 3D Gaussian Splatting pipeline with analytical spherical rig SfM and server-side CUDA/Triton LAN viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "3dgs",
    "gaussian-splatting",
    "insta360",
    "antigravity-a1",
    "insv",
    "fisheye",
    "colmap",
    "glomap",
    "photogrammetry",
    "triton",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.115.0",
    "ninja>=1.11.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "plyfile>=1.0.3",
    "pycolmap>=3.11.0",
    "scipy>=1.13.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
insv-splat = "insv_splat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insv_splat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
